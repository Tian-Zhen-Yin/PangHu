<!DOCTYPE html>
<html>
<head>
    <title>成长记录测试</title>
</head>
<body>
    <h1>成长记录数据测试</h1>
    <button id="loginBtn">登录测试用户</button>
    <button id="fetchRecordsBtn">获取成长记录</button>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');

        function log(message) {
            output.textContent += message + '\n';
            console.log(message);
        }

        // 登录
        document.getElementById('loginBtn').addEventListener('click', async () => {
            log('正在登录...');
            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        account: 'test@example.com',
                        password: 'password123'
                    })
                });
                const data = await response.json();
                log('登录响应: ' + JSON.stringify(data, null, 2));

                if (data.success) {
                    localStorage.setItem('auth_token', data.data.token);
                    log('Token 已保存到 localStorage');
                }
            } catch (error) {
                log('登录失败: ' + error.message);
            }
        });

        // 获取成长记录
        document.getElementById('fetchRecordsBtn').addEventListener('click', async () => {
            const token = localStorage.getItem('auth_token');
            log('当前 Token: ' + (token ? '存在' : '不存在'));

            if (!token) {
                log('请先登录！');
                return;
            }

            log('正在获取成长记录...');
            try {
                const response = await fetch('http://localhost:3000/api/pets/records', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                log('成长记录响应: ' + JSON.stringify(data, null, 2));

                if (data.success) {
                    log('成功获取 ' + data.data.length + ' 条记录');
                    data.data.slice(0, 3).forEach((record, index) => {
                        log(`记录 ${index + 1}: ${record.petName} - ${record.weight}kg - ${record.recordDate}`);
                    });
                }
            } catch (error) {
                log('获取记录失败: ' + error.message);
            }
        });
    </script>
</body>
</html>
